codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        branches:
          - main
    patch:
      default:
        target: 80%
        threshold: 1%
        base: auto

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: no

ignore:
  - "**/*_test.go"
  - "**/examples/**"
  - "**/example/**"
  - "**/example_test.go"
  - "**/types_example_test.go"
  - "**/types_test.go"
  - "**/bdd_test.go"
  - "**/step_test.go"
  - "**/bdd_test.go"
  - "**/http_test.go"
  - "**/setter_test.go"
  - "**/default_test.go"
  - "**/json_test.go"
  - "**/example_test.go"

flags:
  unittests:
    paths:
      - bdd/
      - convert/
      - json/
      - request/
      - setter/
    carryforward: true
